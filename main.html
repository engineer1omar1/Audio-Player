<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Audio Player</title>
		<link rel="stylesheet" href="main.css">
	</head>
	<body>
		<main class="player">

			<header>
                <h1>Audio Player</h1>
                <p>Your Favourite Audios</p>
            </header>

            <div class="artwork" aria-hidden="true">
                <div class="disc"><span></span></div>
            </div>

            <div class="track-info">
                <span id="track-number">Audio 01 / 03</span>
                <h2 id="track-title">Audio Title</h2>
                <p id="track-description">Audio Description</p>
            </div>

                    <audio id="audio" preload="metadata"></audio>

                    <input 
                        id="progress" 
                        class="progress" 
                        type="range" 
                        min="0" 
                        max="100" 
                        value="0" 
                        step="0.1" 
                        aria-label="Playback Position" 
                        disabled>

                    <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="previous" class="secondary" aria-label="Previous track">⏮</button>
                <button id="play" class="play" aria-label="Play">▶</button>
                <button id="next" class="secondary" aria-label="Next track">⏭</button>
            </div>

            <div class="volume">
                <label for="volume">Volume</label>
                <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7">
                <span id="volume-value" class="volume-value">70%</span>
            </div>

			<p id="status" class="status" role="status">We Are Ready</p>
		</main>
		<script src="main.js"></script>
	</body>
</html>
